services:

  # -----------------------------------------------------------------------
  # Приложение (Stormcast)
  # -----------------------------------------------------------------------

  application:
    image: stormcast/application:2.5

    build:
      context: ./application
      dockerfile: Dockerfile

    depends_on:

      database:
        condition: service_healthy

    env_file:
      - .env

    environment:
      TZ: ${COMMON__TIME_ZONE}

    command: >
      python
      manage.py
      runserver 0.0.0.0:${APPLICATION__DASHBOARD__PORT__CONTAINER}

    ports:
      - "${APPLICATION__DASHBOARD__PORT__PUBLISHED}:${APPLICATION__DASHBOARD__PORT__CONTAINER}"
      - "${APPLICATION__INTERFACE__PORT__PUBLISHED}:${APPLICATION__INTERFACE__PORT__CONTAINER}"

    networks:
      - internal
      - proxy  # Добавлено для корректной работы маршрутизации Traefik

    restart: unless-stopped

    healthcheck:

      test: [
        "CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${APPLICATION__INTERFACE__PORT__CONTAINER}/api/v1/health/', timeout=5)"
      ]

      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

    labels:

      # Общие настройки маршрутизации
      - "traefik.enable=true"

      # Маршрут панели управления (основной и ролевой домены)
      - "traefik.http.routers.${APPLICATION__DASHBOARD__ROUTING__DOMAIN}.rule=Host(`${APPLICATION__DASHBOARD__ROUTING__DOMAIN}`) || Host(`${APPLICATION__DASHBOARD__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${APPLICATION__DASHBOARD__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${APPLICATION__DASHBOARD__ROUTING__DOMAIN}.service=${APPLICATION__DASHBOARD__ROUTING__DOMAIN}"

      # Маршрут программного интерфейса (основной и ролевой домены)
      - "traefik.http.routers.${APPLICATION__INTERFACE__ROUTING__DOMAIN}.rule=Host(`${APPLICATION__INTERFACE__ROUTING__DOMAIN}`) || Host(`${APPLICATION__INTERFACE__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${APPLICATION__INTERFACE__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${APPLICATION__INTERFACE__ROUTING__DOMAIN}.service=${APPLICATION__INTERFACE__ROUTING__DOMAIN}"

      # Сервис панели управления
      - "traefik.http.services.${APPLICATION__DASHBOARD__ROUTING__DOMAIN}.loadbalancer.server.port=${APPLICATION__DASHBOARD__PORT__CONTAINER}"

      # Сервис программного интерфейса
      - "traefik.http.services.${APPLICATION__INTERFACE__ROUTING__DOMAIN}.loadbalancer.server.port=${APPLICATION__INTERFACE__PORT__CONTAINER}"


  # -----------------------------------------------------------------------
  # База данных (PostgreSQL)
  # -----------------------------------------------------------------------

  database:
    image: database/postgres:17-alpine

    build:
      context: ./database
      dockerfile: Dockerfile

    environment:
      TZ: ${COMMON__TIME_ZONE}

      POSTGRES_DB: ${DATABASE__GENERAL__NAME}
      POSTGRES_USER: ${DATABASE__CREDENTIALS__DEFAULT__USERNAME}
      POSTGRES_PASSWORD: ${DATABASE__CREDENTIALS__DEFAULT__PASSWORD}

    volumes:

      # Изменяемые данные
      # - ./database/data/runtime:/var/lib/postgresql/data  # Хранение данных в директории хоста (bind mount)
      - database-runtime:/var/lib/postgresql/data           # Хранение данных в именованном томе Docker (volume)

      # Файлы первоначальной инициализации
      # Скрипты и SQL-файлы в этом каталоге выполняются автоматически
      # при первом запуске контейнера.
      - ./database/data/bootstrap:/docker-entrypoint-initdb.d

    networks:

      # Внутренняя сеть проекта
      # База данных доступна только для контейнеров внутри этой сети.
      # Внешний доступ возможен только через проброшенные порты ниже.
      - internal

    ports:

      # Порт базы данных для внешнего доступа
      #
      # Подключение выполняется по IP-адресу сервера и опубликованному порту.
      # Такой способ не требует настройки дополнительной TCP-маршрутизации
      # и обычно проще в эксплуатации, чем использование доменных имён
      # для PostgreSQL.
      #
      # Если порт должен быть доступен только на сервере:
      # - "127.0.0.1:${DATABASE__INTERFACE__PORT__PUBLISHED}:${DATABASE__INTERFACE__PORT__CONTAINER}"
      #
      # Для доступа из локальной сети:
      - "${DATABASE__INTERFACE__PORT__PUBLISHED}:${DATABASE__INTERFACE__PORT__CONTAINER}"

    restart: unless-stopped

    healthcheck:

      test: [
        "CMD-SHELL",
        "pg_isready -U ${DATABASE__CREDENTIALS__DEFAULT__USERNAME} -d ${DATABASE__GENERAL__NAME}"
      ]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s


  # -----------------------------------------------------------------------
  # Менеджер базы данных (pgAdmin)
  # -----------------------------------------------------------------------

  database-manager:
    image: database_manager/pgadmin4:9.17

    build:
      context: ./database_manager
      dockerfile: Dockerfile

    depends_on:

      database:
        condition: service_healthy

    env_file:
      - .env

    environment:

      # Часовой пояс
      TZ: ${COMMON__TIME_ZONE}

      # Отключение многопользовательского режима
      # Позволяет работать без создания отдельных учётных записей.
      PGADMIN_CONFIG_SERVER_MODE: 'False'

      # Отключение требования мастер-пароля
      # Интерфейс открывается без предварительного ввода мастер-пароля.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'

      # Разрешение специальных доменов для электронной почты (например, .local, .dev)
      # Строгий валидатор электронной почты в pgAdmin по умолчанию блокирует зарезервированные домены.
      # Эта настройка добавляет их в белый список, позволяя использовать локальные адреса.
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"

      # Отключение усиленной защиты cookies
      # Упрощает автоматический вход в закрытой сети разработки.
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: 'False'

      # Учётные данные для входа в интерфейс
      #
      # pgAdmin требует синтаксически корректный email-адрес.
      # Адрес используется как идентификатор локальной учётной записи
      # и не обязан соответствовать реальному почтовому ящику.
      PGADMIN_DEFAULT_EMAIL: ${DATABASE_MANAGER__DASHBOARD__CREDENTIALS__DEFAULT__EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${DATABASE_MANAGER__DASHBOARD__CREDENTIALS__DEFAULT__PASSWORD}

    volumes:

      # Изменяемые данные (сессии, настройки интерфейса)
      - database-manager-runtime:/var/lib/pgadmin

      # Каталог управляющих файлов.
      # Монтируется каталог целиком, а не отдельные файлы.
      # Это предотвращает автоматическое создание каталога вместо файла 
      # со стороны Docker, если файл отсутствует на хосте.
      # Скрипт инициализации внутри контейнера создаст файлы в этом каталоге,
      # и они станут доступны на хост-машине.
      - ./database_manager/data/control:/pgadmin4/control

    networks:
      - internal
      - proxy

    ports:
      - "${DATABASE_MANAGER__DASHBOARD__PORT__PUBLISHED}:${DATABASE_MANAGER__DASHBOARD__PORT__CONTAINER}"

    restart: unless-stopped

    labels:

      # Общие настройки маршрутизации
      - "traefik.enable=true"

      # Маршрут панели управления (основной и ролевой домены)
      - "traefik.http.routers.${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}.rule=Host(`${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}`) || Host(`${DATABASE_MANAGER__DASHBOARD__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}.service=${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}"

      # Сервис панели управления
      - "traefik.http.services.${DATABASE_MANAGER__DASHBOARD__ROUTING__DOMAIN}.loadbalancer.server.port=${DATABASE_MANAGER__DASHBOARD__PORT__CONTAINER}"


  # -----------------------------------------------------------------------
  # Архиватор базы данных
  # -----------------------------------------------------------------------

  database-archiver:
    image: database_archiver/alpine:3.20

    build:
      context: ./database_archiver
      dockerfile: Dockerfile

    # Профиль разработчика: образ запускается только при явной передаче параметра профиля
    profiles:
      - dev

    depends_on:

      database:
        condition: service_healthy

    environment:
      TZ: ${COMMON__TIME_ZONE}

    volumes:
      - ./database_archiver/data/artifacts:/data/artifacts

    networks:
      - internal

    restart: unless-stopped


  # -----------------------------------------------------------------------
  # Шина событий (Redis Pub/Sub)
  # -----------------------------------------------------------------------

  event-bus:
    image: redis:7.4-alpine

    environment:
      TZ: ${COMMON__TIME_ZONE}

    command: >
      redis-server
      --maxmemory-policy allkeys-lru

    networks:
      - internal

    restart: unless-stopped

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  # -----------------------------------------------------------------------
  # Объектное хранилище (Silo)
  # -----------------------------------------------------------------------

  object-storage:
    image: pgsty/silo:RELEASE.2026-10-18T00-00-00Z

    environment:
      TZ: ${COMMON__TIME_ZONE}

      MINIO_ROOT_USER: ${OBJECT_STORAGE__CREDENTIALS__DEFAULT__USERNAME}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE__CREDENTIALS__DEFAULT__PASSWORD}

    command: >
      server /data
      --console-address ":${OBJECT_STORAGE__DASHBOARD__PORT__CONTAINER}"

    volumes:
      # - ./object_storage/data/runtime:/data  # Хранение данных в директории хоста (bind mount)
      - object-storage-runtime:/data           # Хранение данных в именованном томе Docker (volume)

    ports:
      - "${OBJECT_STORAGE__DASHBOARD__PORT__PUBLISHED}:${OBJECT_STORAGE__DASHBOARD__PORT__CONTAINER}"
      - "${OBJECT_STORAGE__INTERFACE__PORT__PUBLISHED}:${OBJECT_STORAGE__INTERFACE__PORT__CONTAINER}"

    networks:
      - internal
      - proxy

    restart: unless-stopped

    healthcheck:
  
      test: [
        "CMD", "curl", "-f",
        "http://localhost:${OBJECT_STORAGE__INTERFACE__PORT__CONTAINER}/minio/health/live"
      ]

      interval: 10s
      timeout: 5s
      retries: 5

    labels:

      # Общие настройки маршрутизации
      - "traefik.enable=true"

      # Маршрут панели управления (основной и ролевой домены)
      - "traefik.http.routers.${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}.rule=Host(`${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}`) || Host(`${OBJECT_STORAGE__DASHBOARD__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}.service=${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}"

      # Маршрут программного интерфейса (основной и ролевой домены)
      - "traefik.http.routers.${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}.rule=Host(`${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}`) || Host(`${OBJECT_STORAGE__INTERFACE__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}.service=${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}"

      # Сервис панели управления
      - "traefik.http.services.${OBJECT_STORAGE__DASHBOARD__ROUTING__DOMAIN}.loadbalancer.server.port=${OBJECT_STORAGE__DASHBOARD__PORT__CONTAINER}"

      # Сервис программного интерфейса
      - "traefik.http.services.${OBJECT_STORAGE__INTERFACE__ROUTING__DOMAIN}.loadbalancer.server.port=${OBJECT_STORAGE__INTERFACE__PORT__CONTAINER}"


  # -----------------------------------------------------------------------
  # Почтовый сервер (Mailpit)
  # -----------------------------------------------------------------------

  mail-server:
    image: axllent/mailpit:v1.21

    networks:
      - internal
      - proxy # Добавлено для корректной работы маршрутизации Traefik

    ports:

      # Веб-интерфейс (по умолчанию: 8025)
      - "${MAIL_SERVER__DASHBOARD__PORT__PUBLISHED}:${MAIL_SERVER__DASHBOARD__PORT__CONTAINER}"

      # SMTP (по умолчанию: 1025)
      - "${MAIL_SERVER__INTERFACE__PORT__PUBLISHED}:${MAIL_SERVER__INTERFACE__PORT__CONTAINER}"

    restart: unless-stopped

    labels:

      # Общие настройки маршрутизации
      - "traefik.enable=true"

      # Маршрут панели управления (основной и ролевой домены)
      - "traefik.http.routers.${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}.rule=Host(`${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}`) || Host(`${MAIL_SERVER__DASHBOARD__ROUTING__ROLE_DOMAIN}`)"
      - "traefik.http.routers.${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}.entrypoints=web"
      - "traefik.http.routers.${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}.service=${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}"

      # Сервис панели управления
      - "traefik.http.services.${MAIL_SERVER__DASHBOARD__ROUTING__DOMAIN}.loadbalancer.server.port=${MAIL_SERVER__DASHBOARD__PORT__CONTAINER}"


networks:

  # Внутренняя сеть для связи между сервисами проекта
  internal:
    driver: bridge

  # Внешняя сеть для маршрутизации через Traefik
  proxy:
    external: true


volumes:

  # Рабочие данные PostgreSQL
  #
  # Том содержит физические рабочие файлы PostgreSQL: таблицы, индексы,
  # журналы и другие внутренние данные сервера базы данных.
  #
  # Этот том является средой выполнения конкретного экземпляра PostgreSQL
  # и не предназначен для переноса базы данных между серверами или окружениями.
  #
  # Для резервного копирования и переноса используется логическое копирование
  # базы данных. При восстановлении на новом экземпляре PostgreSQL создаётся
  # новое рабочее хранилище, после чего в него накатывается логическая
  # резервная копия.
  database-runtime:


  # Постоянное хранилище артефактов приложения
  #
  # Том содержит файлы, создаваемые и сохраняемые приложением Stormcast:
  # сформированные документы, отправляемые по электронной почте материалы,
  # сохранённые электронные сообщения и другие производные артефакты.
  #
  # Основные сведения об артефактах, их составе и принадлежности хранятся
  # в PostgreSQL в виде записей. После генерации окончательная отрендеренная
  # версия документа сохраняется в объектном хранилище для последующего
  # доступа и аудита.
  #
  # В отличие от рабочего тома PostgreSQL, это хранилище содержит собственно
  # пользовательские и прикладные данные, созданные системой. При переносе
  # проекта необходимо учитывать как данные PostgreSQL, так и содержимое
  # объектного хранилища.
  object-storage-runtime:

  # Рабочие данные менеджера базы данных
  #
  # Том содержит внутренние данные pgAdmin: локальную базу конфигурации,
  # сведения о зарегистрированных серверах, пользовательские настройки,
  # сохранённые подключения и данные сессий.
  #
  # Эти данные относятся к интерфейсу администрирования и не содержат
  # саму базу PostgreSQL. Их потеря не влияет на данные приложения,
  # однако может потребовать повторной настройки pgAdmin.
  #
  # Том можно пересоздать при необходимости, предварительно сохранив
  # конфигурацию подключений, если она не восстанавливается автоматически.
  database-manager-runtime:
